<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 290" role="img" aria-label="Zak van Sinterklaas met cadeautjes, staf, mijter en pepernoten">
  <defs>
    <pattern id="jute" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#c9935b"/>
      <path d="M0 4h8M4 0v8" stroke="#b37d47" stroke-width="1"/>
    </pattern>
    <radialGradient id="pn" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d49556"/>
      <stop offset="1" stop-color="#8f5126"/>
    </radialGradient>
  </defs>

  <!-- staf -->
  <g stroke-linecap="round" fill="none">
    <path d="M214 282 V78 C214 34 176 26 168 52 C162 72 182 82 192 70" stroke="#111014" stroke-width="15"/>
    <path d="M214 282 V78 C214 34 176 26 168 52 C162 72 182 82 192 70" stroke="#ffe03d" stroke-width="8"/>
  </g>
  <circle cx="214" cy="120" r="9" fill="#ff4fa0" stroke="#111014" stroke-width="3"/>

  <!-- cadeautjes die uit de zak komen -->
  <g stroke="#111014" stroke-width="3" stroke-linejoin="round">
    <rect x="66" y="96" width="40" height="40" rx="3" fill="#ff4fa0" transform="rotate(-10 86 116)"/>
    <path d="M86 96 V136 M66 116 H106" stroke="#ffe03d" stroke-width="6" transform="rotate(-10 86 116)"/>
    <path d="M86 96 V136 M66 116 H106" fill="none" transform="rotate(-10 86 116)" stroke-width="1.5"/>
    <path d="M80 92 C72 80 84 76 86 94 C88 76 100 80 92 92 Z" fill="#ffe03d" transform="rotate(-10 86 116)"/>
    <rect x="104" y="104" width="34" height="32" rx="3" fill="#ffffff" transform="rotate(9 121 120)"/>
    <path d="M121 104 V136" stroke="#ff4fa0" stroke-width="6" transform="rotate(9 121 120)"/>
    <path d="M121 104 V136" fill="none" stroke-width="1.5" transform="rotate(9 121 120)"/>
  </g>

  <!-- zak -->
  <path d="M40 278 C12 276 10 228 30 196 C44 172 62 152 66 134 L140 134 C146 152 162 172 176 196 C196 228 194 276 166 278 Z"
        fill="url(#jute)" stroke="#111014" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M60 140 C70 124 136 124 146 140" fill="#c9935b" stroke="#111014" stroke-width="3.5"/>
  <!-- touw -->
  <path d="M58 146 C80 156 126 156 148 146" fill="none" stroke="#111014" stroke-width="10" stroke-linecap="round"/>
  <path d="M58 146 C80 156 126 156 148 146" fill="none" stroke="#ff4fa0" stroke-width="5" stroke-linecap="round"/>
  <path d="M100 154 C92 172 84 176 80 186 M104 154 C110 172 118 176 122 186" fill="none" stroke="#111014" stroke-width="3" stroke-linecap="round"/>
  <!-- stiksels -->
  <path d="M44 232 l8 3 M150 214 l8 -3 M60 258 l7 -4" stroke="#111014" stroke-width="2.5" stroke-linecap="round"/>
  <!-- label -->
  <g transform="rotate(-8 104 222)">
    <rect x="70" y="200" width="70" height="40" rx="8" fill="#ffffff" stroke="#111014" stroke-width="3"/>
    <circle cx="80" cy="220" r="3.5" fill="#111014"/>
    <text x="110" y="228" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="900" font-size="21" fill="#111014">5 dec</text>
  </g>

  <!-- mijter -->
  <g transform="rotate(-16 70 52)" stroke="#111014" stroke-width="3.5" stroke-linejoin="round">
    <path d="M38 96 L32 46 C32 24 56 8 70 2 C84 8 108 24 108 46 L102 96 Z" fill="#ff4fa0"/>
    <path d="M64 5 L76 5 L78 96 L62 96 Z" fill="#ffffff"/>
    <path d="M35 80 L105 80 L102 98 L38 98 Z" fill="#ffffff"/>
    <path d="M66 34 h8 v10 h10 v8 h-10 v14 h-8 v-14 h-10 v-8 h10 Z" fill="#ffe03d" stroke-width="2.5"/>
  </g>

  <!-- pepernoten -->
  <g stroke="#111014" stroke-width="2">
    <ellipse cx="184" cy="276" rx="9" ry="7.5" fill="url(#pn)"/>
    <ellipse cx="203" cy="283" rx="7.5" ry="6" fill="url(#pn)"/>
    <ellipse cx="164" cy="285" rx="7" ry="5.5" fill="url(#pn)"/>
    <ellipse cx="236" cy="279" rx="8" ry="6.5" fill="url(#pn)"/>
    <ellipse cx="20" cy="284" rx="7" ry="5.5" fill="url(#pn)"/>
    <ellipse cx="242" cy="210" rx="6.5" ry="5.5" fill="url(#pn)"/>
    <ellipse cx="148" cy="80" rx="6" ry="5" fill="url(#pn)"/>
  </g>
</svg>
